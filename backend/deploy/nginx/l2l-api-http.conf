# Bootstrap nginx config — plain HTTP + the Let's Encrypt challenge path.
#
# Used only to get the certificate issued (step 7 of deploy/AWS-AL2023.md).
# Once certbot has the certificate, replace this file with
# l2l-api-https.conf, which redirects :80 to :443 and terminates TLS.
#
# __API_HOST__ is substituted with your sslip.io hostname by the runbook.

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    # Let's Encrypt HTTP-01 challenge. The webroot is nginx's own document root
    # so we inherit its SELinux context — a custom path under /var/www would be
    # blocked by AL2023's enforcing SELinux policy.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    # Evidence uploads. Keep in sync with EVIDENCE_MAX_UPLOAD_BYTES (8 MiB);
    # nginx's default is 1 MiB and the resulting 413 looks like an app bug.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI gateway proxy allows up to 60s upstream; nginx defaults to 60s too.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
