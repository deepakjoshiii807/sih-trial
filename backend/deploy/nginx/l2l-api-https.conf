# Single-domain nginx config — serves the React SPA and proxies /api to Django.
#
# __API_HOST__ is substituted with your sslip.io hostname by the runbook.
#
# On nginx < 1.25 you may add `http2` to the 443 listen directives
# (`listen 443 ssl http2;`); 1.25+ uses the `http2 on;` directive instead.

# :80 — ACME renewals plus a permanent redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — TLS termination, static SPA + API proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Evidence uploads (see EVIDENCE_MAX_UPLOAD_BYTES).
    client_max_body_size 10m;

    # ── /api/* and /admin/* → Django via gunicorn ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Static files served by WhiteNoise (Django admin assets) ─────────
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000/media/;
        proxy_set_header Host $host;
    }

    # ── React SPA — serve from dist/ ────────────────────────────────────
    # Hashed assets (Vite fingerprinted files) get long caches.
    location /assets/ {
        alias /var/www/app/dist/assets/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise fall back to
    # index.html so React Router handles client-side routes.
    root /var/www/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
