# Final nginx config — terminates TLS and proxies to gunicorn on 127.0.0.1:8000.
#
# __API_HOST__ is substituted with your sslip.io hostname by the runbook.
#
# On nginx < 1.25 you may add `http2` to the 443 listen directives
# (`listen 443 ssl http2;`); 1.25+ uses the `http2 on;` directive instead, so it
# is left out here to stay version-agnostic. HTTP/1.1 is plenty for a JSON API.

# :80 — ACME renewals plus a permanent redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — TLS termination.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Evidence uploads (see EVIDENCE_MAX_UPLOAD_BYTES).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # $host (not a hardcoded name) so DJANGO_ALLOWED_HOSTS stays authoritative.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this via SECURE_PROXY_SSL_HEADER, so request.is_secure()
        # is correct and SECURE_SSL_REDIRECT does not loop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
