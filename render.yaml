# Render Blueprint — SkillBridge Django API
#
# Deploy with:
#   1. Push this file to your repo's root
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Render auto-detects this file and provisions everything
#
# After deploy, set these env vars in Render's dashboard:
#   SECRET_KEY          — auto-generated by Render (see below)
#   DATABASE_URL        — auto-linked from the db service
#   CORS_ALLOWED_ORIGINS — your frontend domain(s)
#   FIREBASE_PROJECT_ID — learntoleadd
#   SEED_DEMO           — 1 (first deploy only, set to 0 after)

services:
  # ── Django API ─────────────────────────────────────────────────────────────
  - type: web
    name: skillbridge-api
    runtime: image
    image:
      url: https://github.com/deepakjoshiii807/sih-trial.git
      # Render builds from the Dockerfile in backend/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "skillbridge-api.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://skillbridge-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        value: "DemoPass@123"
      - key: FIREBASE_PROJECT_ID
        value: "learntoleadd"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "2"
      - key: PORT
        value: "8000"
    healthCheckPath: /api/health
    autoDeploy: true
    dockerContext: backend  # build from the backend/ subdirectory

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - type: postgresql
    name: skillbridge-db
    plan: free
    database: skillbridge
    ipAllowList: []  # only accessible from the web service above
