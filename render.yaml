# Render Blueprint — SkillBridge Django API
#
# Deploy with:
#   1. Push this file to your repo's root
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Render auto-detects this file and provisions everything
#
# IMPORTANT: You must create the PostgreSQL database manually first:
#   1. Go to render.com → New + → PostgreSQL
#   2. Name it "skillbridge-db", plan "Free"
#   3. Copy its Internal Database URL
#   4. Set DATABASE_URL in the web service env vars to that URL
#
# After deploy, also set FIREBASE_PROJECT_ID=learntoleadd in env vars.

services:
  - type: web
    name: skillbridge-api
    runtime: image
    image:
      url: https://github.com/deepakjoshiii807/sih-trial.git
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "skillbridge-api.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://skillbridge-api.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        value: "DemoPass@123"
      - key: FIREBASE_PROJECT_ID
        value: "learntoleadd"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "2"
      - key: PORT
        value: "8000"
    healthCheckPath: /api/health
    autoDeploy: true
    dockerContext: backend
